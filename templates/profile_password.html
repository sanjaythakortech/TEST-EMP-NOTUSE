{% extends 'base.html' %}{% block title %}Change Password · OfficeFlow{% endblock %}{% block heading %}Change Password{% endblock %}{% block content %}
<div class="form-page"><div class="form-card narrow"><div class="form-card-head"><div><span class="eyebrow">ACCOUNT SECURITY</span><h2>Change your password</h2><p>Use a strong password with at least 6 characters.</p></div><span class="form-icon"><i class="bi bi-shield-lock"></i></span></div><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="stack-form"><div><label>Current password</label><div class="input-icon password-field"><i class="bi bi-lock"></i><input class="form-control" id="currentPassword" type="password" name="current_password" required><button type="button" class="password-toggle" onclick="togglePassword('currentPassword', this)" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div><div><label>New password</label><div class="input-icon password-field"><i class="bi bi-lock-fill"></i><input class="form-control" id="newPassword" type="password" name="new_password" minlength="6" required><button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div><div><label>Confirm new password</label><div class="input-icon password-field"><i class="bi bi-lock-fill"></i><input class="form-control" id="confirmPassword" type="password" name="confirm_password" minlength="6" required><button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('profile') }}">Cancel</a><button class="btn btn-primary"><i class="bi bi-shield-check"></i> Update password</button></div></form></div></div>
{% endblock %}
